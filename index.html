<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bureau de Konoha — Administration officielle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-storage-compat.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --bg:#0E0F14;
  --bg-1:#15171F;
  --bg-2:#1B1E29;
  --ink:#EDEAE0;
  --ink-dim:#A6A6AE;
  --ink-faint:#6E707C;
  --line: rgba(237,234,224,0.10);
  --line-strong: rgba(237,234,224,0.22);
  --red:#B84439;
  --red-dim: rgba(184,68,57,0.14);
  --gold:#BE9A55;
  --gold-dim: rgba(190,154,85,0.14);
  --violet:#9E8CC9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1000px 600px at 85% -10%, rgba(184,68,57,0.07), transparent 60%),
    radial-gradient(800px 500px at -5% 100%, rgba(190,154,85,0.05), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Playfair Display', serif; font-weight:600; margin:0; color:var(--ink); letter-spacing:0.2px;}
p{line-height:1.6; color:var(--ink-dim);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input, textarea, select{font-family:inherit; font-size:0.95rem;}
::selection{background:var(--red); color:#fff;}

/* SHELL */
.app-shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh;}
.sidebar{
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, var(--bg-1), var(--bg));
  padding:26px 20px; display:flex; flex-direction:column; gap:26px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
.brand img{width:40px; height:40px; object-fit:contain; flex-shrink:0;}
.brand-text h1{font-size:1.02rem; line-height:1.25;}
.brand-text .sub{font-size:0.68rem; color:var(--ink-faint); margin-top:3px; text-transform:uppercase; letter-spacing:0.8px;}

.sidebar-section{display:flex; flex-direction:column; gap:4px;}
.sidebar-label{font-size:0.66rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:1px; margin:4px 2px 6px;}
.nav-link{
  display:block; text-align:left; width:100%; background:none; border:none; color:var(--ink-dim);
  padding:9px 10px; border-radius:4px; font-size:0.86rem; border-left:2px solid transparent;
}
.nav-link:hover{background:var(--bg-2); color:var(--ink);}
.nav-link.active{background:var(--bg-2); color:var(--ink); border-left-color:var(--red); font-weight:500;}

.sidebar-user{
  margin-top:auto; border-top:1px solid var(--line); padding-top:16px;
  display:flex; flex-direction:column; gap:10px;
}
.userchip{display:flex; flex-direction:column; gap:4px; font-size:0.85rem;}
.userchip .name{color:var(--ink);}
.role-tag{
  font-size:0.63rem; padding:2px 8px; border-radius:20px; border:1px solid currentColor;
  letter-spacing:0.4px; width:fit-content; text-transform:uppercase;
}
.role-attente{color:var(--red);}
.role-membre{color:#7FA88A;}
.role-staff{color:var(--gold);}
.role-fondateur{color:var(--violet);}

.content-area{display:flex; flex-direction:column; min-height:100vh;}
main{flex:1; padding:44px 48px 60px;}
.container{max-width:760px;}
footer{border-top:1px solid var(--line); padding:18px 48px; text-align:left; font-size:0.72rem; color:var(--ink-faint);}

.sidebar-toggle{ display:none; }

@media (max-width:840px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:relative; height:auto; padding:16px 18px; gap:14px;}
  .sidebar-top-row{ display:flex; align-items:center; justify-content:space-between; width:100%; }
  .sidebar-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border:1px solid var(--line-strong); border-radius:6px;
    background:transparent; color:var(--ink); font-size:1.15rem; cursor:pointer; flex-shrink:0;
  }
  .sidebar:not(.menu-open) .sidebar-section,
  .sidebar:not(.menu-open) .sidebar-user{ display:none; }
  .sidebar.menu-open .sidebar-section,
  .sidebar.menu-open .sidebar-user{ display:flex; flex-direction:column; }
  main{padding:28px 20px 50px;}
  footer{padding:16px 20px;}
}

/* BUTTONS */
.btn{
  border:1px solid var(--line-strong); background:transparent; color:var(--ink);
  padding:9px 16px; border-radius:4px; font-size:0.85rem; font-weight:500;
  transition:background 0.15s, border-color 0.15s, color 0.15s;
}
.btn:hover{background:var(--bg-2); border-color:var(--ink-dim);}
.btn-primary{background:var(--red); border-color:var(--red); color:#F6E9E6;}
.btn-primary:hover{background:#9A362D; border-color:#9A362D;}
.btn-seal{background:var(--gold); border-color:var(--gold); color:#1B160A;}
.btn-seal:hover{background:#A9863F; border-color:#A9863F;}
.btn-ghost{border-color:var(--line); color:var(--ink-dim); background:transparent;}
.btn-ghost:hover{border-color:var(--line-strong); color:var(--ink);}
.btn-sm{padding:6px 12px; font-size:0.78rem;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}

/* BANNER */
.banner{
  border:1px solid var(--red); background:var(--red-dim); color:#E7B9B2;
  padding:12px 16px; border-radius:6px; font-size:0.85rem; margin-bottom:22px;
}
.banner.success{border-color:#5C8A67; background:rgba(92,138,103,0.14); color:#B7D6BE;}

/* HERO */
.hero{
  border:1px solid var(--line); border-left:3px solid var(--red);
  background:var(--bg-1); padding:36px 34px; margin-bottom:40px; border-radius:6px;
}
.hero .eyebrow{font-size:0.7rem; color:var(--gold); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:12px;}
.hero h2{font-size:2rem; max-width:600px; line-height:1.28; font-style:italic; font-weight:500;}
.hero p{max-width:520px; margin-top:14px;}
.hero .actions{display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;}

.section-title{
  display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;
  border-bottom:1px solid var(--line); padding-bottom:10px;
}
.section-title h3{font-size:1.1rem; font-weight:600;}
.section-title .count{font-size:0.75rem; color:var(--ink-faint);}

/* DIRECTORY */
.directory{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; margin-bottom:44px;}
.plaque{
  border:1px solid var(--line); background:var(--bg-1); border-radius:6px;
  padding:18px; transition:border-color 0.15s;
}
.plaque:hover{border-color:var(--line-strong);}
.plaque .num{
  font-family:'Playfair Display',serif; font-size:0.7rem; color:var(--gold); letter-spacing:0.5px;
  border-bottom:1px solid var(--line); padding-bottom:9px; margin-bottom:11px;
}
.plaque h4{font-size:1.02rem; margin-bottom:6px; font-weight:600;}
.plaque p{font-size:0.82rem; margin:0;}

/* FORMS */
.form-panel{
  border:1px solid var(--line); background:var(--bg-1); border-radius:8px;
  padding:30px 28px; max-width:400px;
}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.75rem; color:var(--ink-faint); margin-bottom:6px;}
.field input, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line-strong);
  background:var(--bg); border-radius:5px; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--red); outline-offset:1px;}
.form-switch{font-size:0.8rem; margin-top:16px; color:var(--ink-faint);}
.form-switch button{background:none;border:none;color:var(--gold);text-decoration:underline;padding:0;font-size:inherit;}

/* WAITING */
.waiting-card{
  border:1px solid var(--line); border-left:3px solid var(--gold);
  background:var(--bg-1); padding:32px; max-width:600px; border-radius:6px;
}
.waiting-card .tag{font-size:0.7rem; color:var(--gold); margin-bottom:12px; text-transform:uppercase; letter-spacing:1px;}
.waiting-card h3{font-size:1.35rem; margin-bottom:12px; font-style:italic;}

.attente-wrap{ display:flex; align-items:center; justify-content:center; min-height:65vh; }
.waiting-card-big{
  max-width:640px; padding:44px 40px; text-align:center; border-left:none;
  border:1px solid var(--gold); box-shadow:0 0 0 1px rgba(190,154,85,0.08), 0 20px 60px rgba(0,0,0,0.35);
}
.waiting-card-big h3{ font-size:1.7rem; }
.waiting-card-big .waiting-lead{ font-size:0.95rem; }
.waiting-notice{
  margin-top:22px; padding:18px 20px; border:1px solid var(--gold); background:var(--gold-dim);
  border-radius:8px; font-size:0.95rem; color:var(--ink); line-height:1.55; font-weight:500;
}

/* TABS */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:24px; flex-wrap:wrap;}
.tab{
  padding:10px 16px; font-size:0.84rem; border:none; background:transparent; color:var(--ink-faint);
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--ink); border-bottom-color:var(--red); font-weight:600;}

/* BUREAU HEAD */
.bureau-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.bureau-head h2{font-size:1.6rem; font-style:italic;}
.bureau-head .desc{color:var(--ink-faint); font-size:0.83rem; margin-top:5px;}

/* ITEM CARDS */
.item-card{
  border:1px solid var(--line); background:var(--bg-1); border-radius:6px;
  padding:16px 18px; margin-bottom:12px;
}
.item-card .meta{display:flex; justify-content:space-between; font-size:0.71rem; color:var(--ink-faint); margin-bottom:9px;}
.item-card h4{font-size:0.98rem; margin-bottom:7px; font-weight:600;}
.item-card .body-text{font-size:0.86rem; color:var(--ink-dim); white-space:pre-wrap;}
.empty-state{border:1px dashed var(--line-strong); padding:30px; text-align:center; color:var(--ink-faint); font-size:0.85rem; border-radius:6px;}

.compose{
  border:1px solid var(--line); background:var(--bg-1); border-radius:8px;
  padding:20px; margin-bottom:28px;
}
.compose .field{margin-bottom:11px;}
.compose textarea{
  width:100%; min-height:90px; padding:10px 11px; border:1px solid var(--line-strong);
  background:var(--bg); border-radius:5px; resize:vertical; color:var(--ink);
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
@media (max-width:600px){.row2,.row3{grid-template-columns:1fr;}}

.status-pill{font-size:0.66rem; padding:2px 9px; border-radius:20px; border:1px solid currentColor; text-transform:uppercase; letter-spacing:0.3px;}
.status-ouvert{color:#D98A82;}
.status-clos{color:#7FA88A;}
.status-payee{color:#7FA88A;}
.status-impayee{color:#D98A82;}
.status-partielle{color:var(--gold);}
.status-demande{color:var(--gold);}
.status-confirme{color:#7FA88A;}
.status-refuse{color:#D98A82;}
.status-termine{color:var(--ink-faint);}

/* ADMIN TABLE */
.admin-table{width:100%; border-collapse:collapse; font-size:0.84rem;}
.admin-table th{
  text-align:left; font-size:0.7rem; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
  border-bottom:1px solid var(--line); padding:9px 10px;
}
.admin-table td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; color:var(--ink-dim);}
.admin-table td strong{color:var(--ink);}
.admin-table select{padding:6px 7px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink); border-radius:4px;}

.staff-nav{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
.staff-nav button{
  border:1px solid var(--line); background:var(--bg-1); color:var(--ink-dim);
  padding:8px 14px; border-radius:20px; font-size:0.81rem;
}
.staff-nav button.active{background:var(--red); color:#F6E9E6; border-color:var(--red); font-weight:600;}

.bareme-picker{ max-height:320px; overflow-y:auto; border:1px solid var(--line-strong); background:var(--bg); border-radius:6px; padding:4px 12px; }
.bareme-palier-label{ font-size:0.68rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.6px; padding:12px 2px 6px; border-top:1px solid var(--line); margin-top:4px; }
.bareme-palier-label:first-child{ border-top:none; margin-top:0; padding-top:10px; }
.bareme-row{ display:grid; grid-template-columns:20px 1fr auto; align-items:center; column-gap:12px; padding:8px 2px; border-radius:4px; }
.bareme-row:hover{ background:rgba(255,255,255,0.04); }
.bareme-row input[type=checkbox]{ width:16px; height:16px; margin:0; accent-color:var(--red); cursor:pointer; }
.bareme-row label{ display:block; font-size:0.85rem; color:var(--ink); cursor:pointer; margin:0; line-height:1.35; }
.bareme-row .price{ font-size:0.78rem; color:var(--gold); white-space:nowrap; }
.bareme-summary{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px; margin-top:4px; border-top:1px solid var(--line-strong); font-size:0.85rem; color:var(--ink); position:sticky; bottom:0; background:var(--bg); }
.bareme-summary strong{ color:var(--gold); }
</style>
</head>

<script>
/* ================================================================
   CONFIGURATION FIREBASE — colle ici les clés de TON projet Firebase
   (Firebase Console → Paramètres du projet → Général → Tes applications)
   ================================================================ */
const firebaseConfig = {
  apiKey: "COLLE_TA_CLE_API_ICI",
  authDomain: "TON-PROJET.firebaseapp.com",
  projectId: "TON-PROJET",
  storageBucket: "TON-PROJET.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:xxxxxxxxxxxxxxxx",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const fbStorage = firebase.storage();

function makeAuthEmail(prenom, nom){
  const clean = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return clean(prenom)+'.'+clean(nom)+'@konoha-village.app';
}
// Crée un compte pour quelqu'un d'autre (admin) sans jamais changer la session
// de la personne connectée — piège classique de Firebase Auth côté client.
function createUserWithoutSignIn(email, password){
  const secondaryApp = firebase.initializeApp(firebaseConfig, 'secondary-'+Date.now());
  return secondaryApp.auth().createUserWithEmailAndPassword(email, password).then(function(cred){
    const uid = cred.user.uid;
    return secondaryApp.auth().signOut().then(function(){ return secondaryApp.delete(); }).then(function(){ return uid; });
  });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }

/* ---------------- STORAGE (Firestore) ---------------- */
async function loadSectionsAndAudit(){
  const loaded = {};
  for(const key of SECTION_KEYS){
    try{
      const snap = await db.collection('konohaSections').doc(key).get();
      loaded[key] = normalizeSection(key, snap.exists ? snap.data() : {});
    }catch(e){
      loaded[key] = normalizeSection(key, {});
    }
    if(!loaded[key].__seeded){
      loaded[key].__seeded = true;
      db.collection('konohaSections').doc(key).set(loaded[key]).catch(()=>{});
    }
  }
  state.sections = loaded;

  try{
    const snap = await db.collection('konohaAudit').doc('log').get();
    state.auditLog = snap.exists ? (snap.data().entries || []) : [];
  }catch(e){ state.auditLog = []; }
}

function subscribeUsers(){
  db.collection('konohaUsers').onSnapshot(function(snap){
    state.users = snap.docs.map(function(d){ return { id: d.id, ...d.data() }; });
    render();
  });
}

let unsubCurrentUser = null;
async function loadAll(){
  await loadSectionsAndAudit();
  subscribeUsers();

  auth.onAuthStateChanged(function(fbUser){
    if(unsubCurrentUser){ unsubCurrentUser(); unsubCurrentUser = null; }
    if(fbUser){
      unsubCurrentUser = db.collection('konohaUsers').doc(fbUser.uid).onSnapshot(function(snap){
        if(!snap.exists){ return; }
        const wasNull = !state.currentUser;
        state.currentUser = { id: fbUser.uid, ...snap.data() };
        if(wasNull || state.loading){
          const profile = state.currentUser;
          if(profile.role==='attente') state.view = 'attente';
          else if(isFullAccess(profile)) state.view = 'admin';
          else { state.view = 'bureau'; state.activeSection = profile.section; }
        }
        state.loading = false;
        render();
      });
    } else {
      state.currentUser = null;
      state.view = 'accueil';
      state.loading = false;
      render();
    }
  });
}

function normalizeSection(key, data){
  data = data || {};
  data.salon = data.salon || [];
  data.documents = data.documents || [];
  data.rendezvous = data.rendezvous || [];
  if(key==='police'){
    data.casJudiciaires = (data.casJudiciaires || []).map(c => ({ photos:[], ...c }));
    data.rapports = data.rapports || [];
    data.amendes = (data.amendes || []).map(a => ({ montantPaye:0, paiements:[], ...a }));
    data.cellule = data.cellule || [];
    data.infractions = (data.infractions && data.infractions.length) ? data.infractions : DEFAULT_INFRACTIONS.slice();
  }
  if(key==='medecins'){
    data.dossiers = (data.dossiers || []).map(d => ({ bilans:[], ...d }));
    data.donSang = data.donSang || [];
    data.frigo = data.frigo || [];
    data.pharmacie = data.pharmacie || [];
  }
  if(key==='finance'){
    data.stocks = data.stocks || [];
    data.banque = data.banque || { solde:0 };
    data.logs = data.logs || [];
    data.impots = (data.impots && data.impots.length) ? data.impots : DEFAULT_IMPOTS.slice();
  }
  return data;

}

async function register(){
  const prenom = document.getElementById('r-prenom').value.trim();
  const nom = document.getElementById('r-nom').value.trim();
  const pass = document.getElementById('r-pass').value;
  const pass2 = document.getElementById('r-pass2').value;
  const sectionDemandee = document.getElementById('r-section').value;
  if(!prenom || !nom || !pass || !sectionDemandee){ flash("Merci de remplir tous les champs, y compris le bureau souhaité.", 'error'); return; }
  if(pass !== pass2){ flash("Les mots de passe ne correspondent pas.", 'error'); return; }
  if(pass.length < 6){ flash("Le mot de passe doit contenir au moins 6 caractères.", 'error'); return; }
  const email = makeAuthEmail(prenom, nom);
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('konohaUsers').doc(cred.user.uid).set({
      prenom, nom, section:null, sectionDemandee, grade:null, role:'attente',
      dateCreation: new Date().toISOString()
    });
    logAudit(prenom+" "+nom+" a créé un compte et demande à rejoindre "+SECTIONS[sectionDemandee].label+".", 'Comptes');
    flash("Votre espace a été créé.", 'success');
    // onAuthStateChanged prend le relais pour afficher l'écran d'attente
  }catch(e){
    if(e.code==='auth/email-already-in-use') flash("Un compte existe déjà pour ce nom et prénom.", 'error');
    else flash("Impossible de créer le compte pour le moment.", 'error');
  }
}

async function changePassword(){
  const u = state.currentUser;
  if(!u || !auth.currentUser) return;
  const current = document.getElementById('pw-current').value;
  const next = document.getElementById('pw-new').value;
  const confirmNext = document.getElementById('pw-confirm').value;
  if(!next || next.length<6){ flash("Le nouveau mot de passe doit contenir au moins 6 caractères.", 'error'); return; }
  if(next !== confirmNext){ flash("Les nouveaux mots de passe ne correspondent pas.", 'error'); return; }
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(auth.currentUser.email, current);
    await auth.currentUser.reauthenticateWithCredential(cred);
    await auth.currentUser.updatePassword(next);
    logAudit(u.prenom+" "+u.nom+" a changé son mot de passe.", 'Comptes');
    document.getElementById('pw-current').value='';
    document.getElementById('pw-new').value='';
    document.getElementById('pw-confirm').value='';
    flash("Mot de passe mis à jour.", 'success');
  }catch(e){
    flash("Le mot de passe actuel est incorrect.", 'error');
  }
}

async function retirerMembre(userId){
  const acteur = state.currentUser;
  const target = state.users.find(u=>u.id===userId);
  if(!target || !acteur) return;
  if(target.id===acteur.id){ flash("Vous ne pouvez pas retirer vos propres accès depuis ici.", 'error'); return; }
  if(target.role==='fondateur' && acteur.role!=='fondateur'){ flash("Seul le Fondateur peut retirer un compte Fondateur.", 'error'); return; }
  if(!confirm("Retirer les accès de "+target.prenom+" "+target.nom+" ? Le compte repassera en attente d'affectation.")) return;
  await updateUserDoc(userId, { role:'attente', section:null, grade:null, sectionDemandee:null });
  logAudit(target.prenom+" "+target.nom+" a eu ses accès retirés par "+authorName()+".", 'Comptes');
  flash("Accès retirés pour "+target.prenom+" "+target.nom+".", 'success');
}

async function adminUpdate(userId){
  const sel = document.getElementById('sec-'+userId);
  const rol = document.getElementById('role-'+userId);
  const prenomInput = document.getElementById('prenom-'+userId);
  const nomInput = document.getElementById('nom-'+userId);
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;

  const newPrenom = prenomInput.value.trim();
  const newNom = nomInput.value.trim();
  if(!newPrenom || !newNom){ flash("Le prénom et le nom ne peuvent pas être vides.", 'error'); return; }
  const conflict = state.users.some(x => x.id!==userId && x.prenom.toLowerCase()===newPrenom.toLowerCase() && x.nom.toLowerCase()===newNom.toLowerCase());
  if(conflict){ flash("Un autre compte porte déjà ce nom et prénom.", 'error'); return; }

  const patch = { prenom:newPrenom, nom:newNom, section: sel.value===''?null:sel.value, role: rol.value };
  if(patch.role==='attente'){ patch.section=null; patch.grade=null; }
  else if(patch.role==='staff' || patch.role==='fondateur'){ patch.section=null; patch.grade=null; patch.sectionDemandee=null; }
  else if(patch.section){
    const grades = SECTIONS[patch.section].grades;
    patch.grade = grades.includes(u.grade) ? u.grade : grades[grades.length-1];
    patch.sectionDemandee = null;
  } else {
    patch.grade = null;
  }
  await updateUserDoc(userId, patch);
  if(auth.currentUser && auth.currentUser.uid===userId) await refreshCurrentUserFromDb();
  logAudit("Fiche modifiée par le secrétariat : "+patch.prenom+" "+patch.nom+" ("+roleLabel(patch.role)+(patch.section?(", "+SECTIONS[patch.section].label):"")+").", 'Comptes');
  flash("Fiche de "+patch.prenom+" "+patch.nom+" mise à jour.", 'success');
}

async function acceptRequest(userId){
  const u = state.users.find(x=>x.id===userId);
  if(!u || !u.sectionDemandee){ flash("Aucune demande de bureau en attente pour ce compte.", 'error'); return; }
  const grades = SECTIONS[u.sectionDemandee].grades;
  const gradeSel = document.getElementById('req-grade-'+userId);
  const chosenGrade = (gradeSel && grades.includes(gradeSel.value)) ? gradeSel.value : grades[grades.length-1];
  await updateUserDoc(userId, { section: u.sectionDemandee, role:'membre', grade: chosenGrade, sectionDemandee: null });
  logAudit(u.prenom+" "+u.nom+" a été affecté à "+SECTIONS[u.sectionDemandee].label+" avec le grade "+chosenGrade+".", 'Comptes');
  flash(u.prenom+" "+u.nom+" a été affecté avec le grade "+chosenGrade+".", 'success');
}

function resizePhotoToBlob(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function addCasPhotos(casId){
  const input = document.getElementById('cas-photo-'+casId);
  if(!input.files || input.files.length===0) return;
  const cas = state.sections.police.casJudiciaires.find(c=>c.id===casId);
  if(!cas) return;
  cas.photos = cas.photos || [];
  for(const file of Array.from(input.files)){
    try{
      const blob = await resizePhotoToBlob(file, 1000);
      const path = 'cas/'+casId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg';
      const ref = fbStorage.ref(path);
      await ref.put(blob);
      const url = await ref.getDownloadURL();
      cas.photos.push({ url, path });
    }catch(e){ /* photo ignorée si illisible ou échec d'envoi */ }
  }
  input.value = '';
  await saveSection('police');
  flash("Photo(s) ajoutée(s) au dossier.", 'success');
  render();
}

async function paySelectedAmendes(){
  const input = document.getElementById('am-pay-amount');
  const amount = parseFloat(input.value);
  if(isNaN(amount) || amount<=0){ flash("Indiquez un montant de paiement valide.", 'error'); return; }
  if(state.selectedAmendes.length===0){ flash("Sélectionnez au moins une amende.", 'error'); return; }
  let remaining = amount;
  const list = state.sections.police.amendes
    .filter(a=>state.selectedAmendes.includes(a.id))
    .sort((a,b)=> new Date(a.date)-new Date(b.date));
  for(const a of list){
    const due = a.montant - (a.montantPaye||0);
    if(due<=0 || remaining<=0) continue;
    const pay = Math.min(due, remaining);
    a.montantPaye = (a.montantPaye||0) + pay;
    a.paiements.push({ montant:pay, date:new Date().toISOString(), auteur: authorName() });
    remaining -= pay;
  }
  await saveSection('police');
  logAudit("Paiement d'amende(s) enregistré : "+amount+" Ryo sur "+list.length+" amende(s).", 'Police');
  const reste = remaining;
  state.selectedAmendes = [];
  render();
  flash(reste>0 ? `Paiement enregistré. ${reste} Ryo n'ont pas pu être affectés (amendes déjà soldées).` : "Paiement enregistré.", 'success');
}
async function soldeAmende(id){

  const due = a.montant - (a.montantPaye||0);

  a.montantPaye = a.montant;
  a.paiements.push({ montant:due, date:new Date().toISOString(), auteur: authorName() });

  await saveSection(key);
  logAudit("Rendez-vous de "+rdv.demandeur+" dans "+SECTIONS[key].label+" : "+statut+".", 'Rendez-vous');

}

/* ---------------- DOSSIERS MÉDICAUX ---------------- */
function setDossierSearch(v){ state.dossierSearch = v; render(); }
function toggleDossier(id){ state.activeDossierId = state.activeDossierId===id ? null : id; render(); }
async function addDossierMedical(){
  const nom = document.getElementById('dos-nom').value.trim();
  const groupe = document.getElementById('dos-groupe').value;
  const maladies = document.getElementById('dos-maladies').value.trim();
  if(!nom){ flash("Le nom du joueur est requis.", 'error'); return; }
  const exists = state.sections.medecins.dossiers.some(d=>d.nomJoueur.toLowerCase()===nom.toLowerCase());
  if(exists){ flash("Un dossier existe déjà pour ce joueur.", 'error'); return; }
  state.sections.medecins.dossiers.unshift({ id:uid(), nomJoueur:nom, groupeSanguin:groupe, maladies: maladies||'Aucune connue', dateCreation:new Date().toISOString(), auteur: authorName(), bilans:[] });
  await saveSection('medecins');
  logAudit("Dossier médical créé pour "+nom+".", 'Médecins');
  render();
}
async function updateDossierInfo(dossierId){
  const groupe = document.getElementById('dos-groupe-'+dossierId).value;
  const maladies = document.getElementById('dos-maladies-'+dossierId).value.trim();
  const dossier = state.sections.medecins.dossiers.find(d=>d.id===dossierId);
  if(!dossier) return;
  dossier.groupeSanguin = groupe;
  dossier.maladies = maladies || 'Aucune connue';
  await saveSection('medecins');
  flash("Dossier médical mis à jour.", 'success');
  render();
}
async function addBilan(dossierId){
  const type = document.getElementById('bilan-type-'+dossierId).value;
  const resultat = document.getElementById('bilan-resultat-'+dossierId).value.trim();
  if(!resultat){ flash("Merci de renseigner le résultat du bilan.", 'error'); return; }
  const dossier = state.sections.medecins.dossiers.find(d=>d.id===dossierId);
  if(!dossier) return;
  dossier.bilans.unshift({ id:uid(), type, resultat, auteur: authorName(), date:new Date().toISOString() });
  await saveSection('medecins');
  logAudit("Bilan ("+type+") ajouté au dossier de "+dossier.nomJoueur+".", 'Médecins');
  render();
}
async function deleteDossier(id){
  if(!confirm("Supprimer ce dossier médical ?")) return;
  const removed = state.sections.medecins.dossiers.find(d=>d.id===id);
  state.sections.medecins.dossiers = state.sections.medecins.dossiers.filter(d=>d.id!==id);
  if(state.activeDossierId===id) state.activeDossierId=null;
  await saveSection('medecins');
  logAudit("Dossier médical supprimé"+(removed?(" ("+removed.nomJoueur+")"):"")+".", 'Médecins');
  render();
}

/* ---------------- DON DU SANG ---------------- */
async function postDonSang(){
  const nom = document.getElementById('don-nom').value.trim();
  const groupe = document.getElementById('don-groupe').value;
  const dernierDon = document.getElementById('don-dernier').value;
  const sante = document.getElementById('don-sante').value;
  const dispo = document.getElementById('don-dispo').value.trim();
  if(!nom || !groupe || !dispo){ flash("Nom, groupe sanguin et disponibilité sont requis.", 'error'); return; }
  if(sante==='non'){ flash("Le don n'est pas possible : le donneur doit être en bonne santé.", 'error'); return; }
  if(dernierDon==='1mois-'){ flash("Le délai minimum entre deux dons est de 3 mois.", 'error'); return; }
  state.sections.medecins.donSang.unshift({ id:uid(), nom, groupeSanguin:groupe, dernierDon, sante, disponibilite:dispo, statut:'en_attente', auteur: authorName(), date:new Date().toISOString() });
  await saveSection('medecins');
  logAudit("Demande de don du sang de "+nom+" ("+groupe+").", 'Médecins');
  flash("Demande de don enregistrée.", 'success');
  render();
}
async function traiterDonSang(id, statut){
  const d = state.sections.medecins.donSang.find(x=>x.id===id);
  if(!d) return;
  d.statut = statut;
  d.traitePar = authorName();
  await saveSection('medecins');
  render();
}

/* ---------------- FRIGO À SANG ---------------- */
async function addPoche(){
  const groupe = document.getElementById('frigo-groupe').value;
  const donneur = document.getElementById('frigo-donneur').value.trim();
  const volume = document.getElementById('frigo-volume').value;
  if(!groupe){ flash("Le groupe sanguin est requis.", 'error'); return; }
  const ref = 'POCH-'+groupe.replace('+','P').replace('-','M')+'-'+Date.now().toString().slice(-5);
  state.sections.medecins.frigo.unshift({ id:uid(), groupe, donneur: donneur||'Anonyme', volume:Number(volume), reference:ref, statut:'disponible', auteur: authorName(), date:new Date().toISOString() });
  await saveSection('medecins');
  logAudit("Poche de sang "+groupe+" ajoutée au frigo ("+(donneur||'anonyme')+").", 'Médecins');
  document.getElementById('frigo-donneur').value='';
  render();
}
async function updatePocheStatut(id, statut){
  const p = state.sections.medecins.frigo.find(x=>x.id===id);
  if(!p) return;
  p.statut = statut;
  await saveSection('medecins');
  logAudit("Poche "+p.reference+" marquée \""+statut+"\".", 'Médecins');
  render();
}
function setFrigoFilter(f){ state.frigoFilter = f; render(); }

/* ---------------- PHARMACIE ---------------- */
async function addRemede(){
  const nom = document.getElementById('pharma-nom').value.trim();
  const categorie = document.getElementById('pharma-cat').value;
  const qte = parseInt(document.getElementById('pharma-qte').value) || 0;
  if(!nom || qte<1){ flash("Nom et quantité (au moins 1) requis.", 'error'); return; }
  const existing = state.sections.medecins.pharmacie.find(r=>r.nom.toLowerCase()===nom.toLowerCase());
  if(existing){ existing.quantite += qte; }
  else{ state.sections.medecins.pharmacie.push({ id:uid(), nom, categorie, quantite:qte, auteur: authorName() }); }
  await saveSection('medecins');
  document.getElementById('pharma-nom').value=''; document.getElementById('pharma-qte').value='1';
  render();
}
async function utiliserRemede(id){
  const r = state.sections.medecins.pharmacie.find(x=>x.id===id);
  if(!r || r.quantite<=0) return;
  r.quantite -= 1;
  await saveSection('medecins');
  logAudit("1 unité de \""+r.nom+"\" utilisée.", 'Médecins');
  render();
}
async function supprimerRemede(id){
  if(!confirm("Supprimer ce remède du stock ?")) return;
  state.sections.medecins.pharmacie = state.sections.medecins.pharmacie.filter(x=>x.id!==id);
  await saveSection('medecins');
  render();
}
function setPharmaFilter(cat){ state.pharmaFilter = cat; render(); }

function authorName(){
  const u = state.currentUser;

/* ---------------- NAVIGATION HELPERS ---------------- */

function render(){

          </tr>

        }).join('')}

    </table>
  `;
}

function renderBureau(){
  const u = state.currentUser;
  if(!u){ state.view='connexion'; return renderAuth('connexion'); }
  refreshCurrentUser();
  const key = state.activeSection || u.section;
  if(!key){ state.view='attente'; return renderAttente(); }
  if(u.role==='membre' && u.section!==key){
    state.activeSection = u.section;
    return renderBureauContent(u.section);
  }
  return renderBureauContent(key);
}

function buildTabs(key){
  const tabs = [['salon','Salon'],['documents','Dossiers']];
  if(key==='police'){
    tabs.push(['cas','Cas judiciaires'],['bareme','Barème des amendes'],['amendes','Amendes'],['rapports','Rapports'],['cellule','Cellule']);
  }
  if(key==='medecins'){
    tabs.push(['dossiers','Dossiers médicaux'],['donsang','Don du sang'],['frigo','Frigo à sang'],['pharmacie','Pharmacie']);
  }
  if(key==='finance'){
    tabs.push(['stocks','Stocks'],['banque','Banque'],['impots','Impôts'],['logs','Logs']);
  }
  tabs.push(['rendezvous','Rendez-vous'],['effectifs','Effectifs']);
  return tabs;
}

function renderBureauContent(key){
  const s = SECTIONS[key];
  const data = state.sections[key];
  const tabs = buildTabs(key);

  return `
    <div class="bureau-head">
      <div><h2>${esc(s.label)}</h2><div class="desc">${esc(s.room)} — ${esc(s.desc)}</div></div>
    </div>
    <div class="tabs">
      ${tabs.map(([id,label])=>`<button class="tab ${state.activeTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}
    </div>
    ${renderTabContent(key, data)}
  `;
}

function renderTabContent(key, data){
  if(state.activeTab==='salon') return renderSalon(key, data);
  if(state.activeTab==='documents') return renderDocuments(key, data);
  if(state.activeTab==='rendezvous') return renderRendezvous(key, data);
  if(state.activeTab==='effectifs') return renderEffectifs(key);
  if(key==='police'){
    if(state.activeTab==='cas') return renderCas(data);
    if(state.activeTab==='bareme') return renderBareme(data);
    if(state.activeTab==='rapports') return renderRapports(data);
    if(state.activeTab==='amendes') return renderAmendes(data);
    if(state.activeTab==='cellule') return renderCellule(data);
  }
  if(key==='medecins'){
    if(state.activeTab==='dossiers') return renderDossiersMedicaux(data);
    if(state.activeTab==='donsang') return renderDonSang(data);
    if(state.activeTab==='frigo') return renderFrigo(data);
    if(state.activeTab==='pharmacie') return renderPharmacie(data);
  }
  if(key==='finance'){
    if(state.activeTab==='stocks') return renderStocks(data);
    if(state.activeTab==='banque') return renderBanque(data);
    if(state.activeTab==='impots') return renderImpots(data);
    if(state.activeTab==='logs') return renderLogs(data);
  }
  return '';
}

      `).join('')
    }
  `;
}

function renderRendezvous(key, data){
  const canHandle = canHandleAppointments(key);
  const motifField = key==='medecins'
    ? `<select id="rdv-motif">${Object.entries(MOTIFS_RDV_MEDECINS).map(([cat,items])=>`<optgroup label="${cat}">${items.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</optgroup>`).join('')}</select>`
    : `<input id="rdv-motif" type="text" placeholder="Motif du rendez-vous">`;
  return `
    <div class="compose">
      <div class="row3">
        <div class="field"><input id="rdv-demandeur" type="text" placeholder="Nom du demandeur"></div>
        <div class="field"><input id="rdv-date" type="date"></div>
        <div class="field">${motifField}</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="postRendezvous('${key}')">Demander un rendez-vous</button>
    </div>
    ${data.rendezvous.length===0 ? `<div class="empty-state">Aucun rendez-vous demandé.</div>` :
      data.rendezvous.map(r=>`
        <div class="item-card">
          <div class="meta"><span>${esc(r.auteur)}</span><span>${fmtDate(r.date)}</span></div>
          <h4>${esc(r.demandeur)} <span class="status-pill status-${r.statut}">${
            r.statut==='demande'?'En attente':r.statut==='confirme'?'Confirmé':r.statut==='refuse'?'Refusé':'Terminé'
          }</span></h4>
          <div class="body-text"><strong>Motif :</strong> ${esc(r.motif)}${r.dateSouhaitee?`\\nDate souhaitée : ${esc(r.dateSouhaitee)}`:''}${r.priseEnCharge?`\\nPris en charge par : ${esc(r.priseEnCharge)}`:''}</div>
          ${canHandle ? `
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              ${r.statut==='demande' ? `
                <button class="btn btn-primary btn-sm" onclick="traiterRendezvous('${key}','${r.id}','confirme')">Confirmer</button>
                <button class="btn btn-ghost btn-sm" onclick="traiterRendezvous('${key}','${r.id}','refuse')">Refuser</button>
              ` : ''}
              ${r.statut==='confirme' ? `<button class="btn btn-seal btn-sm" onclick="traiterRendezvous('${key}','${r.id}','termine')">Marquer terminé</button>` : ''}
            </div>
          ` : ''}
        </div>
      `).join('')
    }
    <p style="font-size:0.76rem; margin-top:10px;">Les rendez-vous sont traités par les membres du bureau ayant au minimum le grade de 2ᵉ classe (avant-dernier échelon ou plus).</p>
  `;
}

function renderDossiersMedicaux(data){
  const term = state.dossierSearch.trim().toLowerCase();
  const list = term ? data.dossiers.filter(d=>d.nomJoueur.toLowerCase().includes(term)) : data.dossiers;
  const groupes = ['A+','A-','B+','B-','AB+','AB-','O+','O-','Inconnu'];

  return `
    <div class="compose">
      <div class="section-title" style="border:none; padding:0; margin-bottom:12px;"><h3 style="font-size:0.95rem;">Nouveau dossier</h3></div>
      <div class="row3">
        <div class="field"><input id="dos-nom" type="text" placeholder="Nom du joueur"></div>
        <div class="field">
          <select id="dos-groupe">${groupes.map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
        </div>
        <div class="field"><input id="dos-maladies" type="text" placeholder="Maladies / allergies connues"></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="addDossierMedical()">Créer le dossier</button>
    </div>

    <div class="compose" style="display:flex; gap:10px; align-items:center;">
      <input id="dos-search" type="text" placeholder="Rechercher un joueur…" value="${esc(state.dossierSearch)}" style="flex:1; padding:9px 11px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink); border-radius:5px;" onkeydown="if(event.key==='Enter'){ setDossierSearch(this.value); }">
      <button class="btn btn-ghost btn-sm" onclick="setDossierSearch(document.getElementById('dos-search').value)">Rechercher</button>
    </div>

    <div class="section-title"><h3>Dossiers médicaux</h3><span class="count">${list.length} dossier(s)</span></div>
    ${list.length===0 ? `<div class="empty-state">Aucun dossier ${term?'ne correspond à cette recherche':'enregistré'}.</div>` :
      list.map(d=>`
        <div class="item-card">
          <h4>${esc(d.nomJoueur)} <span style="font-size:0.75rem; color:var(--gold); font-family:'IBM Plex Sans',sans-serif;">Groupe ${esc(d.groupeSanguin)}</span></h4>
          <div class="body-text"><strong>Maladies / allergies :</strong> ${esc(d.maladies)}</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toggleDossier('${d.id}')">${state.activeDossierId===d.id ? 'Fermer le dossier' : 'Ouvrir le dossier'}</button>

          ${state.activeDossierId===d.id ? `
            <div style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
              <div class="row3">
                <div class="field">
                  <label>Groupe sanguin</label>
                  <select id="dos-groupe-${d.id}">${groupes.map(g=>`<option value="${g}" ${d.groupeSanguin===g?'selected':''}>${g}</option>`).join('')}</select>
                </div>
                <div class="field" style="grid-column:span 2;"><label>Maladies / allergies</label><input id="dos-maladies-${d.id}" type="text" value="${esc(d.maladies)}"></div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="updateDossierInfo('${d.id}')">Enregistrer les informations</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteDossier('${d.id}')">Supprimer le dossier</button>

              <div class="section-title" style="margin-top:20px;"><h3 style="font-size:0.95rem;">Bilans médicaux</h3><span class="count">${d.bilans.length}</span></div>
              <div class="compose">
                <div class="row2">
                  <div class="field">
                    <select id="bilan-type-${d.id}">
                      ${Object.entries(BILAN_TYPES).map(([cat, items])=>`<optgroup label="${cat}">${items.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}</optgroup>`).join('')}
                    </select>
                  </div>
                  <div class="field"><input id="bilan-resultat-${d.id}" type="text" placeholder="Résultat / observations"></div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="addBilan('${d.id}')">Ajouter au dossier</button>
              </div>
              ${d.bilans.length===0 ? `<div class="empty-state">Aucun bilan enregistré.</div>` :
                d.bilans.map(b=>`
                  <div class="item-card">
                    <div class="meta"><span>${esc(b.auteur)}</span><span>${fmtDate(b.date)}</span></div>
                    <h4>${esc(b.type)}</h4>
                    <div class="body-text">${esc(b.resultat)}</div>
                  </div>
                `).join('')
              }
            </div>
          ` : ''}
        </div>
      `).join('')
    }
  `;
}

function renderDonSang(data){

function renderFrigo(data){
  const groupesStats = GROUPES_SANGUINS.map(g=>({ g, n: data.frigo.filter(p=>p.groupe===g && p.statut==='disponible').length }));
  const filtre = state.frigoFilter;
  const poches = filtre==='tous' ? data.frigo : data.frigo.filter(p=>p.statut===filtre);
  return `
    <div class="row3" style="margin-bottom:18px;">
      ${groupesStats.map(s=>`
        <div class="item-card" style="text-align:center; margin-bottom:0;">
          <div style="font-size:0.72rem; color:var(--ink-faint);">${s.g}</div>
          <div style="font-size:1.3rem; font-weight:700; color:var(--gold);">${s.n}</div>
        </div>
      `).join('')}
    </div>
    <div class="compose">
      <div class="section-title" style="border:none; padding:0; margin-bottom:12px;"><h3 style="font-size:0.95rem;">Enregistrer une poche</h3></div>
      <div class="row3">
        <div class="field">
          <select id="frigo-groupe">
            <option value="">Groupe</option>
            ${GROUPES_SANGUINS.map(g=>`<option value="${g}">${g}</option>`).join('')}
          </select>
        </div>
        <div class="field"><input id="frigo-donneur" type="text" placeholder="Donneur"></div>
        <div class="field">
          <select id="frigo-volume">
            <option value="250">250 mL</option>
            <option value="450" selected>450 mL</option>
            <option value="500">500 mL</option>
          </select>
        </div>
      </div>
      <button class="btn btn-seal btn-sm" onclick="addPoche()">Enregistrer la poche</button>
    </div>
    <div class="staff-nav">
      ${[['tous','Toutes'],['disponible','Disponibles'],['utilisee','Utilisées'],['perimee','Périmées']].map(([f,l])=>`<button class="${filtre===f?'active':''}" onclick="setFrigoFilter('${f}')">${l}</button>`).join('')}
    </div>
    ${poches.length===0 ? `<div class="empty-state">Aucune poche ${filtre==='tous'?'enregistrée':'dans ce filtre'}.</div>` :
      poches.map(p=>`
        <div class="item-card">
          <h4>${esc(p.reference)} — ${esc(p.groupe)} · ${p.volume} mL <span class="status-pill status-${p.statut==='disponible'?'payee':'impayee'}">${p.statut}</span></h4>
          <div class="body-text">Donneur : ${esc(p.donneur)}</div>
          ${p.statut==='disponible' ? `
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="btn btn-ghost btn-sm" onclick="updatePocheStatut('${p.id}','utilisee')">Marquer utilisée</button>
              <button class="btn btn-ghost btn-sm" onclick="updatePocheStatut('${p.id}','perimee')">Marquer périmée</button>
            </div>
          ` : ''}
        </div>
      `).join('')
    }
  `;
}

function renderPharmacie(data){
  const isChef = state.currentUser && (state.currentUser.grade==='Chef Médecin' || isFullAccess(state.currentUser));
  const filtre = state.pharmaFilter;
  const remedes = filtre==='tous' ? data.pharmacie : data.pharmacie.filter(r=>r.categorie===filtre);
  return `
    ${isChef ? `
      <div class="compose">
        <div class="section-title" style="border:none; padding:0; margin-bottom:12px;"><h3 style="font-size:0.95rem;">💊 Ajouter un remède au stock</h3></div>
        <div class="row3">
          <div class="field"><input id="pharma-nom" type="text" placeholder="Nom du remède"></div>
          <div class="field"><input id="pharma-qte" type="number" min="1" value="1" placeholder="Quantité"></div>
          <div class="field">
            <select id="pharma-cat">${CATEGORIES_PHARMACIE.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addRemede()">Ajouter au stock</button>
      </div>
    ` : ''}
    <div class="staff-nav">
      <button class="${filtre==='tous'?'active':''}" onclick="setPharmaFilter('tous')">Toutes</button>
      ${CATEGORIES_PHARMACIE.map(c=>`<button class="${filtre===c?'active':''}" onclick="setPharmaFilter('${esc(c)}')">${esc(c)}</button>`).join('')}
    </div>
    ${remedes.length===0 ? `<div class="empty-state">Aucun remède ${filtre==='tous'?'en stock':'dans cette catégorie'}.</div>` :
      remedes.map(r=>`
        <div class="item-card">
          <h4>${esc(r.nom)} <span style="font-size:0.75rem; color:var(--ink-faint); font-family:'IBM Plex Sans',sans-serif;">${esc(r.categorie)}</span></h4>
          <div class="body-text" style="color:${r.quantite===0?'var(--red)':r.quantite<5?'var(--gold)':'inherit'}; font-weight:600;">${r.quantite} en stock</div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            ${r.quantite>0 ? `<button class="btn btn-seal btn-sm" onclick="utiliserRemede('${r.id}')">− 1 Utiliser</button>` : ''}
            ${isChef ? `<button class="btn btn-ghost btn-sm" onclick="supprimerRemede('${r.id}')">Supprimer</button>` : ''}
          </div>
        </div>
      `).join('')
    }
  `;
}

function renderImpots(data){
  const canEdit = canEditImpots();
  const editing = state.editingImpotId ? data.impots.find(i=>i.id===state.editingImpotId) : null;
  return `
    <div class="compose">
      <div class="section-title" style="border:none; padding:0; margin-bottom:12px;"><h3 style="font-size:0.95rem;">Percevoir un impôt</h3></div>
      <div class="row3">
        <div class="field"><input id="perc-joueur" type="text" placeholder="Nom du joueur"></div>
        <div class="field">
          <select id="perc-grade">${data.impots.map(i=>`<option value="${i.id}">${esc(i.grade)} — ${i.montant} Ryo</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="percevoirImpot()">Encaisser</button>
      </div>
    </div>

    ${canEdit ? `
      <div class="compose">
        <div class="section-title" style="border:none; padding:0; margin-bottom:12px;"><h3 style="font-size:0.95rem;">${editing ? "Modifier un palier d'impôt" : "Ajouter un palier d'impôt"}</h3></div>
        <div class="row2">
          <div class="field"><input id="imp-grade" type="text" value="${editing?esc(editing.grade):''}" placeholder="Nom du grade (ex : Genin)"></div>
          <div class="field"><input id="imp-montant" type="number" value="${editing?editing.montant:''}" placeholder="Montant (Ryo)"></div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-seal btn-sm" onclick="saveImpot()">${editing ? 'Enregistrer' : 'Ajouter'}</button>
          ${editing ? `<button class="btn btn-ghost btn-sm" onclick="cancelEditImpot()">Annuler</button>` : ''}
        </div>
      </div>
    ` : ''}

    <div class="section-title"><h3>Barème des impôts par grade</h3><span class="count">${data.impots.length} palier(s)</span></div>
    <table class="admin-table">
      <thead><tr><th>Grade</th><th>Montant</th>${canEdit?'<th></th>':''}</tr></thead>
      <tbody>
        ${data.impots.map(i=>`
          <tr>
            <td><strong>${esc(i.grade)}</strong></td>
            <td>${i.montant} Ryo</td>
            ${canEdit ? `<td>
              <button class="btn btn-ghost btn-sm" onclick="startEditImpot('${i.id}')">Modifier</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteImpot('${i.id}')">Supprimer</button>
            </td>` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

/* ---------------- INIT ---------------- */
render();
loadAll();
</script>
